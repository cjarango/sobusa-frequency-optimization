services:
  db:
    image: postgres:16-alpine
    container_name: sobusa-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: frecuencias
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - sobusa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frecuencias"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: sobusa-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres123@db:5432/frecuencias
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./templates:/app/templates

volumes:
  sobusa_pgdata: